[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emquote"
version = "0.1.0"
description = "东方财富公开行情只读 CLI（报价 / K 线 / 曲线图）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "emquote contributors" }]
keywords = ["eastmoney", "a-share", "quote", "kline", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
  "requests>=2.31",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]

[project.scripts]
emquote = "emquote.cli:main"
emplot-channel = "emquote.plot_cli:main_channel"
emplot-pv = "emquote.plot_cli:main_pv"

[tool.setuptools.packages.find]
where = ["src"]
